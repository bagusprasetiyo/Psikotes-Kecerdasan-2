{c:"P",d:"v",s:"Prioritas dan delegasi",q:"Pukul 13.00, seorang Kepala Seksi harus menyerahkan laporan ke inspektorat pukul 15.00 (penyusunan butuh 2 jam) dan masih harus menerima seorang warga lansia yang menunggu sejak pagi untuk keluhan layanan (butuh 1 jam). Seorang staf dapat menyiapkan data laporan sehingga penyusunan hanya butuh 1 jam. Tindakan paling efektif?",o:["Mengerjakan laporan penuh 2 jam dan meminta warga kembali besok.","Meminta staf menyiapkan data sambil menerima warga (13.00–14.00), lalu menyusun laporan (14.00–15.00).","Menyerahkan keluhan kepada staf yang tidak berwenang menyelesaikannya, lalu menyusun laporan sendiri.","Meminta inspektorat menunda laporan satu hari tanpa alasan khusus.","Menerima warga dahulu lalu menyusun laporan sendirian hingga pukul 16.00."],k:1,e:"Dengan delegasi data, total kerja 1 jam + 1 jam = 2 jam, tepat selesai pukul 15.00 dan keluhan warga tertangani oleh pihak berwenang. Opsi C melanggar kewenangan; opsi E terlambat."},
{c:"P",d:"x",s:"Optimasi anggaran",q:"Anggaran tersedia Rp12 juta. Kegiatan tidak dapat dipecah. Pelatihan: biaya Rp6 juta, 40 penerima manfaat. Sosialisasi: biaya Rp5 juta, 120 penerima. Perbaikan fasilitas: biaya Rp4 juta, 60 penerima. Kombinasi yang memaksimalkan jumlah penerima manfaat?",o:["Pelatihan dan sosialisasi","Pelatihan dan perbaikan fasilitas","Sosialisasi dan perbaikan fasilitas","Ketiga kegiatan dengan memangkas biaya masing-masing","Hanya sosialisasi"],k:2,e:"Kombinasi layak: P+S = Rp11 juta → 160 orang; P+F = Rp10 juta → 100 orang; S+F = Rp9 juta → 180 orang. Ketiganya Rp15 juta melebihi anggaran. Maksimum: S+F (180)."},
{c:"P",d:"v",s:"Etika dan integritas",q:"Seorang staf pelayanan perizinan menerima kiriman bingkisan bernilai tinggi dari pemohon yang izinnya sedang diproses. Pemohon menyatakan itu “tanda terima kasih” dan tidak meminta apa pun. Tindakan paling tepat?",o:["Menerima, lalu membagikannya ke seluruh rekan agar tidak dianggap pribadi.","Menyimpan dulu, mengembalikannya setelah izin terbit.","Memproses izin sesuai aturan dan menerima bingkisan karena tidak ada permintaan.","Menolak atau mengembalikan bingkisan, mendokumentasikan, dan melaporkan ke unit pengendalian gratifikasi.","Mengabaikan karena belum ada keputusan izin."],k:3,e:"Pemberian yang berkaitan dengan jabatan berpotensi gratifikasi. Langkah terbaik: menolak/mengembalikan, mencatat, dan melapor. Opsi lain tetap menyisakan konflik kepentingan."},
{c:"P",d:"h",s:"Penanganan konflik",q:"Dua staf berselisih soal pembagian tugas pada proyek yang tenggatnya tiga hari lagi, dan pekerjaan mulai terhambat. Langkah awal pemimpin yang paling efektif?",o:["Mengadakan pertemuan singkat, merujuk uraian tugas, lalu menetapkan pembagian tugas tertulis dengan tenggat.","Membiarkan keduanya menyelesaikan sendiri agar belajar.","Memindahkan salah satu staf ke unit lain segera.","Memberi sanksi kepada keduanya sebelum mengetahui akar masalah.","Mengerjakan seluruh proyek sendiri."],k:0,e:"Konflik yang mengganggu tenggat perlu intervensi cepat berbasis aturan (uraian tugas) dan hasil tertulis. Pembiaran, pemindahan, atau sanksi dini tidak menyelesaikan akar masalah."},
{c:"P",d:"h",s:"Integritas data",q:"Setelah laporan dikirim ke atasan, Anda menemukan kesalahan angka yang mengubah satu kesimpulan, dan belum ada yang menyadarinya. Tindakan terbaik?",o:["Menunggu apakah ada yang menyadari.","Memperbaiki file sumber diam-diam tanpa mengirim ulang.","Mengirim ulang tanpa penjelasan agar tidak memicu pertanyaan.","Menyalahkan sumber data dan menunggu klarifikasi.","Segera memberi tahu atasan, mengirim koreksi, dan menjelaskan dampaknya terhadap kesimpulan."],k:4,e:"Akuntabilitas menuntut koreksi transparan dan cepat karena kesimpulan terpengaruh keputusan. Koreksi diam-diam atau penundaan merusak kepercayaan."},
{c:"V",d:"h",s:"Kosakata",q:"Dalam manajemen risiko bencana, “mitigasi” paling tepat bermakna …",o:["pemindahan risiko kepada pihak lain","upaya mengurangi dampak atau keparahan risiko","penghapusan seluruh risiko","pengabaian risiko yang kecil","penundaan penanganan risiko"],k:1,e:"Mitigasi adalah tindakan mengurangi dampak/keparahan. Pemindahan risiko disebut transfer risiko; mitigasi tidak menghapus risiko seluruhnya."},
{c:"V",d:"v",s:"Istilah administrasi",q:"Dalam administrasi pemerintahan, “diskresi” paling tepat bermakna …",o:["kewenangan pejabat mengambil keputusan dalam batas hukum ketika aturan tidak mengatur atau tidak jelas","kebebasan pejabat bertindak tanpa batas aturan","pendelegasian tugas kepada bawahan","pengawasan internal atas keputusan","pembatalan keputusan oleh pengadilan"],k:0,e:"Diskresi tetap dibatasi hukum dan tujuan pelayanan. Opsi B salah karena menyebut “tanpa batas”."},
{c:"V",d:"x",s:"Simpulan bacaan",q:"Kebijakan subsidi tepat sasaran dinilai berhasil karena anggaran subsidi turun 15%. Namun, survei menemukan 22% rumah tangga miskin yang berhak justru belum terdaftar sebagai penerima.\n\nSimpulan yang paling sah berdasarkan paragraf adalah …",o:["Kebijakan itu gagal total karena anggaran turun.","Penurunan anggaran membuktikan sasaran sudah tepat.","Penurunan anggaran belum tentu menandakan ketepatan sasaran.","Rumah tangga miskin tidak membutuhkan subsidi.","Survei tersebut tidak relevan dengan kebijakan."],k:2,e:"Efisiensi anggaran dapat terjadi karena sebagian yang berhak tidak terdaftar. Karena itu A terlalu kuat, B tidak sah, dan D serta E tidak didukung teks."},
{c:"V",d:"x",s:"Asumsi tersirat",q:"“Sejak aplikasi pengaduan diluncurkan, jumlah pengaduan menurun 40%. Jadi, kualitas layanan meningkat.”\n\nAsumsi yang paling mendasari argumen tersebut adalah …",o:["Aplikasi mudah dipakai oleh semua warga.","Penurunan pengaduan mencerminkan berkurangnya masalah, bukan berkurangnya kemudahan warga mengadu.","Semua pengaduan sebelumnya valid.","Anggaran layanan meningkat.","Petugas bekerja lebih lama."],k:1,e:"Argumen mengubah penurunan angka menjadi perbaikan kualitas. Hal itu hanya sah jika penurunan bukan karena warga kesulitan mengadu lewat aplikasi."},

{c:"L",d:"v",s:"Silogisme",q:"Premis 1: Semua pegawai disiplin menerima tunjangan kinerja.\nPremis 2: Sebagian pegawai tidak menerima tunjangan kinerja.\n\nSimpulan yang pasti benar adalah …",o:["Semua pegawai disiplin.","Sebagian pegawai tidak disiplin.","Sebagian pegawai disiplin tidak menerima tunjangan.","Tidak ada pegawai disiplin.","Semua pegawai tidak disiplin."],k:1,e:"Kontraposisi P1: yang tidak menerima tunjangan pasti tidak disiplin. Karena ada pegawai yang tidak menerima tunjangan, ada pegawai yang tidak disiplin."},
{c:"L",d:"x",s:"Implikasi berantai",q:"Jika anggaran disetujui, maka proyek dimulai. Jika proyek dimulai, maka tender diumumkan. Tender tidak diumumkan.\n\nSimpulan yang pasti benar adalah …",o:["Anggaran disetujui tetapi proyek belum dimulai.","Proyek dimulai tetapi anggaran belum disetujui.","Anggaran tidak disetujui dan proyek tidak dimulai.","Anggaran disetujui.","Tidak dapat disimpulkan."],k:2,e:"Tender tidak diumumkan → proyek tidak dimulai (modus tollens) → anggaran tidak disetujui (modus tollens lagi)."},
{c:"L",d:"v",s:"Urutan posisi",q:"Lima orang C, A, B, D, E berbaris dari depan. A berada di belakang C tetapi di depan B. D tepat di belakang B. E paling belakang.\n\nSiapa yang berada pada urutan ketiga dari depan?",o:["A","C","D","B","E"],k:3,e:"C di depan A, A di depan B, D tepat di belakang B, E terakhir: urutan C, A, B, D, E. Urutan ketiga adalah B."},

{c:"L",d:"v",s:"Pengodean",q:"Dalam suatu sandi, setiap huruf digeser 3 huruf ke depan dalam alfabet (A→D, B→E, dst.). Bagaimana “DAERAH” disandikan?",o:["FCGTCJ","GDHUDL","HEIVEL","AXBOXE","GDHUDK"],k:4,e:"D→G, A→D, E→H, R→U, A→D, H→K: GDHUDK. Opsi A (+2), C (+4), D (−3), dan B (huruf terakhir salah) adalah jebakan."},
{c:"A",d:"h",s:"Persentase berurutan",q:"Harga barang naik 20%, kemudian diberi diskon 25% dari harga baru. Dibanding harga awal, harga akhir …",o:["naik 5%","tetap","turun 5%","turun 10%","turun 15%"],k:3,e:"1,2 × 0,75 = 0,9 dari harga awal, sehingga turun 10%."},
{c:"A",d:"v",s:"Produktivitas",q:"Enam petugas menyelesaikan 120 berkas dalam 10 hari dengan laju sama. Berapa petugas dibutuhkan untuk menyelesaikan 180 berkas dalam 6 hari?",o:["12","15","18","20","24"],k:1,e:"Laju per orang = 120 ÷ (6×10) = 2 berkas/hari. Kebutuhan = 180 ÷ (6×2) = 15 petugas."},
{c:"A",d:"x",s:"Rata-rata gabungan",q:"Rata-rata nilai 8 peserta adalah 75. Setelah 2 peserta baru bergabung, rata-rata 10 peserta menjadi 78. Rata-rata nilai 2 peserta baru adalah …",o:["84","86","88","90","92"],k:3,e:"Total awal 8×75 = 600. Total baru 10×78 = 780. Selisih 180 untuk 2 peserta: rata-rata 90."},
{c:"A",d:"v",s:"Kecepatan rata-rata",q:"Seorang petugas berangkat ke lokasi dengan kecepatan 60 km/jam dan pulang lewat rute sama dengan 40 km/jam. Kecepatan rata-rata seluruh perjalanan adalah …",o:["45 km/jam","48 km/jam","50 km/jam","52 km/jam","55 km/jam"],k:1,e:"Misal jarak satu arah d. Waktu = d/60 + d/40 = d/24. Kecepatan rata-rata = 2d ÷ (d/24) = 48 km/jam."},

const vis=q=>S.fl==="all"||(S.fl==="un"&&S.a[q.id]==null)||(S.fl==="an"&&S.a[q.id]!=null)||(S.fl==="fl"&&S.f[q.id]);
return '<aside class="card" aria-label="Navigasi soal"><h3>Navigasi soal</h3><div class="row" style="margin-bottom:10px">'+Object.keys(m).map(k=>'<button class="btn" style="padding:4px 10px;min-height:36px;'+(S.fl===k?"border-color:var(--ac);background:var(--hl)":"")+'" onclick="setF(\''+k+'\')">'+m[k]+'</button>').join("")+'</div><div class="ng">'+Q.filter(vis).map(q=>'<button class="nv '+(S.f[q.id]?"f":S.a[q.id]!=null?"a":"")+(Q[S.cur].id===q.id?" c":"")+'" aria-label="Soal '+q.id+(S.a[q.id]!=null?", terjawab":", belum dijawab")+(S.f[q.id]?", ragu-ragu":"")+'" onclick="go('+(q.id-1)+')">'+q.id+'</button>').join("")+'</div><p class="mu" style="font-size:.85rem;margin-bottom:0">Hijau: dijawab. Oranye: ragu-ragu. Garis biru: soal aktif.</p></aside>'}
function exam(){const q=Q[S.cur],r=rem();
return '<header class="hd"><div class="w row sp"><div><b>SIMULASI TES KECERDASAN IPDN</b><div style="font-size:.8rem;opacity:.85">CAT Psikologi Kecerdasan · Ujian berlangsung · '+ansN()+'/'+Q.length+' terjawab</div></div><div class="row"><span id="tm" class="tm '+(r<=300?"c":r<=1800?"w":"")+'" role="timer" aria-label="Sisa waktu">'+fmt(r)+'</span><button class="btn" onclick="theme()" aria-label="Ganti tema">Tema</button></div></div></header><main class="w"><div class="g"><section class="card" aria-live="polite"><div style="margin-bottom:8px"><b>Soal '+q.id+' dari '+Q.length+'</b> '+tg(CAT[q.c])+tg(DIF[q.d])+(S.f[q.id]?tg("Ragu-ragu"):"")+'</div><p style="font-size:1.08rem">'+esc(q.q)+'</p><div role="radiogroup" aria-label="Pilihan jawaban">'+q.o.map((o,i)=>'<label class="opt '+(S.a[q.id]===i?"s":"")+'"><input type="radio" name="o" '+(S.a[q.id]===i?"checked":"")+' onchange="pick('+i+')"><span><b>'+L[i]+'.</b> '+o+'</span></label>').join("")+'</div><div class="row" style="margin-top:14px"><button class="btn" onclick="go(S.cur-1)" '+(S.cur===0?"disabled":"")+'>SEBELUMNYA</button><button class="btn" onclick="go(S.cur+1)" '+(S.cur===Q.length-1?"disabled":"")+'>BERIKUTNYA</button><button class="btn w2" onclick="flg()">'+(S.f[q.id]?"BATAL RAGU":"RAGU-RAGU")+'</button><button class="btn" onclick="clr()">HAPUS JAWABAN</button></div><div class="row" style="margin-top:14px"><button class="btn p" onclick="askSubmit()">SELESAI DAN KUMPULKAN</button></div></section>'+nav()+'</div></main>'}
function home(){const run=S.st==="run";
return '<main class="w"><div class="row sp"><span class="mu">Materi latihan independen</span><button class="btn" onclick="theme()">Tema</button></div><section class="card" style="margin-top:12px"><h1>SIMULASI TES KECERDASAN IPDN</h1><p class="mu">CAT Psikologi Kecerdasan · Computer-Based Test — High Order Thinking Skills</p><p>Platform latihan mandiri untuk mengembangkan kemampuan berpikir praktis, verbal, logis, dan analitis.</p><div class="stats">'+[[Q.length,"Soal"],[dur()/60+" menit","Durasi (60 detik per soal)"],[4,"Kategori"],[5,"Opsi tiap soal"],["Tinggi","Tingkat kesulitan"]].map(x=>'<div class="stat"><b>'+x[0]+'</b>'+x[1]+'</div>').join("")+'</div><p class="mu" style="margin-top:14px">Materi latihan independen. Bukan aplikasi resmi IPDN dan tidak merepresentasikan soal resmi seleksi. Latihan ini bukan tes psikologi berstandar dan hasilnya bukan diagnosis kecerdasan.</p></section>'
+(VAL.er.length?'<div class="card no" role="alert"><b>Validasi bank soal gagal:</b><br>'+VAL.er.join("<br>")+'</div>':'<div class="card"><b class="ok">Validasi bank soal lolos</b> untuk '+Q.length+' soal ('+Object.keys(VAL.cnt).map(k=>CAT[k]+" "+VAL.cnt[k]).join(", ")+').'+(VAL.full?"":'<p class="mu" style="margin:6px 0 0">Bank ini berisi contoh awal. Distribusi target adalah 100 soal (25 per kategori); tambahkan soal pada larik <code>Q</code> dan durasi menyesuaikan otomatis hingga 100 menit.</p>')+'</div>')
+(!store?'<div class="card no" role="alert">Penyimpanan browser tidak tersedia. Progres dan riwayat tidak akan tersimpan.</div>':"")+(corrupt?'<div class="card no" role="alert">Data lokal rusak dan diabaikan.</div>':"")
+'<section class="card"><h2>Materi</h2>'+Object.keys(CAT).map(k=>'<p><b>'+CAT[k]+'</b> — '+SUM[k]+'</p>').join("")+'</section><section class="card"><h2>Petunjuk</h2><ul><li>Timer dimulai setelah Anda menekan “MULAI SIMULASI” dan mengonfirmasi kesiapan.</li><li>Jawaban tersimpan otomatis; Anda bebas berpindah soal dan menandai ragu-ragu.</li><li>Benar 1 poin, salah atau kosong 0 poin, tanpa pengurangan.</li><li>Hasil dan pembahasan tersedia setelah ujian selesai. Timer berbasis browser dan bukan pengawasan ketat.</li></ul><div class="row">'+(run?'<button class="btn p" onclick="V=\'exam\';tick();render()">LANJUTKAN UJIAN</button><button class="btn d" onclick="askClear()">Hapus progres</button>':'<button class="btn p" onclick="askStart()" '+(VAL.er.length?"disabled":"")+'>MULAI SIMULASI</button>')+'<button class="btn" onclick="show(\'hist\')">Riwayat simulasi ('+HIST.length+')</button></div></section></main>'}
function result(){const r=R,p=r.score;const lv=p>=90?"performa latihan sangat kuat":p>=80?"performa latihan kuat":p>=70?"performa latihan cukup kuat":p>=60?"performa latihan perlu diperkuat":"perlu penguatan dasar dan latihan terstruktur";
const cs=Object.keys(CAT).map(k=>({k,n:r.cats[k]||0,t:r.tot[k]||0})).sort((a,b)=>a.n/a.t-b.n/b.t);
return '<main class="w"><div class="row sp noprint"><button class="btn" onclick="show(\'home\')">Beranda</button><div class="row"><button class="btn" onclick="print()">Cetak</button><button class="btn" onclick="show(\'review\',R,\'all\')">TINJAUAN DAN PEMBAHASAN</button></div></div><section class="card" style="margin-top:12px"><h1>Hasil simulasi</h1><p class="mu">'+new Date(r.at).toLocaleString("id-ID")+'</p><div class="stats">'+[[r.score+"/100","Skor akhir"],[r.ok,"Benar"],[r.no,"Salah"],[r.bl,"Tidak dijawab"],[Math.round(r.ok/r.qn*100)+"%","Ketepatan"],[fmt(r.dur),"Durasi"]].map(x=>'<div class="stat"><b>'+x[0]+'</b>'+x[1]+'</div>').join("")+'</div></section><section class="card"><h2>Analisis per kategori</h2>'+Object.keys(CAT).map(k=>{const n=r.cats[k]||0,t=r.tot[k]||0,pc=Math.round(n/t*100);return '<p style="margin-bottom:2px"><b>'+CAT[k]+'</b>: '+n+' dari '+t+' ('+pc+'%)</p><div class="bar" role="img" aria-label="'+pc+' persen"><i style="width:'+pc+'%"></i></div><div style="height:10px"></div>'}).join("")+'</section><section class="card"><h2>Interpretasi</h2><p>Skor latihan '+r.score+': '+lv+'.</p><p class="mu">Interpretasi ini hanya panduan internal aplikasi, bukan standar kelulusan atau klasifikasi psikologis resmi, dan tidak mendiagnosis kecerdasan.</p></section><section class="card"><h2>Rekomendasi belajar</h2><p>Tiga prioritas perbaikan:</p><ol>'+cs.slice(0,3).map(c=>'<li><b>'+CAT[c.k]+'</b> ('+c.n+'/'+c.t+'): '+TIPS[c.k]+'</li>').join("")+'</ol><p><b>Pengelolaan waktu:</b> sasaran rata-rata 60 detik per soal. Lewati soal yang melebihi 90 detik, tandai ragu-ragu, dan kembali di akhir. Waktu Anda: '+Math.round(r.dur/r.qn)+' detik per soal.</p></section></main>'}
function review(){const r=R,f=rf;const list=Q.filter(q=>{const a=r.a[q.id];return f==="all"||(f==="no"&&a!=null&&a!==q.k)||(f==="bl"&&a==null)||f===q.c});
const fl={all:"Semua",no:"Salah",bl:"Tidak dijawab",P:"Praktis",V:"Verbal",L:"Logis",A:"Analitis"};
return '<main class="w"><div class="row sp noprint"><button class="btn" onclick="show(\'result\')">Kembali ke hasil</button><button class="btn" onclick="print()">Cetak</button></div><h2 style="margin-top:12px">Tinjauan dan pembahasan</h2><div class="row noprint" style="margin-bottom:12px">'+Object.keys(fl).map(k=>'<button class="btn" style="'+(f===k?"border-color:var(--ac);background:var(--hl)":"")+'" onclick="show(\'review\',null,\''+k+'\')">'+fl[k]+'</button>').join("")+'</div>'+(list.length?"":'<div class="card">Tidak ada soal pada filter ini.</div>')+list.map(q=>{const a=r.a[q.id],st=a==null?"Tidak dijawab":a===q.k?"Benar":"Salah";
return '<article class="card"><div><b>Soal '+q.id+'</b> '+tg(CAT[q.c])+tg(DIF[q.d])+'<b class="'+(a===q.k?"ok":"no")+'">'+st+'</b></div><p>'+esc(q.q)+'</p>'+q.o.map((o,i)=>'<div class="opt '+(i===q.k?"k":a===i?"x":"")+'"><span><b>'+L[i]+'.</b> '+o+(i===q.k?" (kunci)":"")+(a===i?" (jawaban Anda)":"")+'</span></div>').join("")+'<div class="ex">'+rich(q)+'</div></article>'}).join("")+'</main>'}
function hist(){return '<main class="w"><div class="row sp"><button class="btn" onclick="show(\'home\')">Beranda</button>'+(HIST.length?'<button class="btn d" onclick="askDel()">Hapus riwayat</button>':"")+'</div><section class="card" style="margin-top:12px"><h2>Riwayat simulasi</h2>'+(HIST.length?'<div style="overflow-x:auto"><table><tr><th>Tanggal</th><th>Skor</th><th>B/S/K</th><th>P</th><th>V</th><th>L</th><th>A</th><th>Durasi</th><th></th></tr>'+HIST.map(h=>'<tr><td>'+new Date(h.at).toLocaleString("id-ID")+'</td><td><b>'+h.score+'</b></td><td>'+h.ok+"/"+h.no+"/"+h.bl+'</td>'+Object.keys(CAT).map(k=>'<td>'+(h.cats[k]||0)+"/"+h.tot[k]+'</td>').join("")+'<td>'+fmt(h.dur)+'</td><td style="white-space:nowrap"><button class="btn" style="min-height:36px" onclick="open2(\''+h.id+'\',\'result\')">Hasil</button> <button class="btn" style="min-height:36px" onclick="open2(\''+h.id+'\',\'review\')">Pembahasan</button></td></tr>').join("")+'</table></div><p class="mu">B/S/K: benar/salah/kosong.</p>':'<p class="mu">Belum ada riwayat. Selesaikan satu simulasi untuk melihat hasilnya di sini.</p>')+'</section></main>'}
const TP={'Prioritas dan delegasi':'Hitung dulu durasi tiap tugas, jumlahkan, lalu cocokkan dengan tenggat; pilih opsi yang memenuhi semua batas waktu dan kewenangan.','Optimasi sumber daya':'Tulis semua kombinasi yang muat anggaran, jumlahkan manfaatnya, ambil yang terbesar. Coret kombinasi yang melebihi anggaran lebih dulu.','Etika dan integritas':'Pola jawaban benar: tolak, dokumentasikan, laporkan lewat jalur resmi. Coret opsi menerima, menyembunyikan, atau membiarkan.','Integritas data':'Transparan dan cepat: laporkan, koreksi, jelaskan dampak. Coret opsi yang diam-diam atau menunggu.','Penanganan konflik':'Urutan aman: klarifikasi fakta, rujuk aturan, putuskan secara tertulis. Coret opsi menghukum atau membiarkan.','Manajemen layanan':'Beban kerja = jumlah orang × waktu per orang. Bagi dengan batas waktu, lalu bulatkan KE ATAS.','Pengambilan keputusan':'Pilih yang menurunkan risiko, sesuai prosedur, adil, dan komunikatif. Waspadai kata \u201clangsung\u201d, \u201csemua\u201d, \u201cdiam-diam\u201d.','Kosakata':'Pecah kata menjadi akar dan imbuhan (ver- = benar, de- = mengurangi), lalu coret opsi yang berlawanan arah.','Antonim':'Tentukan arah makna kata soal, coret semua sinonim, pilih yang berlawanan.','Analogi':'Ubah menjadi kalimat hubungan (\u201cX adalah alat ukur Y\u201d), lalu uji pada pasangan kedua.','Simpulan bacaan':'Cari klaim dan bukti; simpulan tidak boleh melebihi bukti. Curigai kata \u201cpasti\u201d, \u201csemua\u201d, \u201cgagal total\u201d.','Asumsi tersirat':'Tanya: apa yang harus benar agar argumen berlaku? Sangkal tiap opsi; jika argumen runtuh, itulah asumsinya.','Silogisme':'Gambar lingkaran himpunan. Jawaban pasti adalah hubungan yang benar pada semua kemungkinan gambar.','Implikasi berantai':'Jika akibat terakhir tidak terjadi, runut mundur: semua sebab ikut tidak terjadi (kontraposisi).','Urutan posisi':'Mulai dari petunjuk paling pasti (paling depan/belakang), gabungkan \u201ctepat di belakang\u201d sebagai satu blok.','Pola angka':'Hitung selisih; bila tidak tetap, hitung selisih dari selisih, jumlah dua suku, atau perkalian.','Pengodean':'Cek huruf pertama untuk mencoret opsi, lalu verifikasi huruf kedua. Ingat Z kembali ke A.','Persentase berurutan':'Kalikan faktor: naik 25% = ×1,25; diskon 40% = ×0,6. Jangan menjumlahkan persen.','Produktivitas':'Cari laju per orang per hari dulu, baru hitung kebutuhan baru.','Rata-rata gabungan':'Bekerja dengan total (rata-rata × jumlah), bukan langsung dengan rata-rata.','Kecepatan rata-rata':'Jarak sama berarti rata-rata harmonik 2ab/(a+b), bukan rata-rata biasa.','Kombinatorika':'\u201cMinimal 1\u201d = semua kemungkinan dikurangi kemungkinan tanpa satu pun.','Rasio':'Cari nilai satu bagian (total ÷ jumlah rasio), lalu kalikan selisih bagian.'};
[['Optimasi anggaran','Optimasi sumber daya'],['Istilah administrasi','Kosakata'],['Pola ganda','Pola angka'],['Pola rekursif','Pola angka']].forEach(([a,b])=>TP[a]=TP[b]);
const TC={P:'Pilih opsi yang sesuai aturan, adil, dan transparan; coret yang diam-diam, sepihak, atau ekstrem.',V:'Eliminasi opsi yang melampaui teks atau berlawanan makna, lalu bandingkan dua opsi tersisa.',L:'Tuliskan premis dalam simbol atau diagram sebelum menjawab.',A:'Ubah cerita menjadi hitungan per satuan, kerjakan bertahap, lalu cek dengan perkiraan kasar.'};
const bx=(t,k)=>'<span class='+(k?'bk':'bx')+'>'+t+'</span>';
const bars=(a,hl)=>{const m=Math.max(...a.map(x=>x[1]));return a.map((x,i)=>'<div class='+(i===hl?'brk':'br')+'><span>'+x[0]+'</span><i style=width:'+Math.max(3,x[1]/m*100)+'%></i><b>'+x[1]+'</b></div>').join('')};
function vis(q){let m,h='';const T=q.q,E=q.e,a=q.o[q.k];
if(/^Pola/.test(q.s)&&(m=T.match(/pola: (.+?), \u2026/))){const n=m[1].split(', ').map(Number),x=parseFloat(a),sg=d=>(d>=0?'+':'')+d;h=n.map((v,i)=>'<span class=cl>'+bx(v)+'<small>'+(i?sg(v-n[i-1]):'&nbsp;')+'</small></span>').join('')+'<span class=cl>'+bx(a,1)+'<small>'+sg(x-n[n.length-1])+'</small></span><p class=mu>Angka kecil di bawah kotak = selisih dari suku sebelumnya.</p>'}
else if(q.s==='Pengodean'&&(m=T.match(/digeser (\d+) huruf[\s\S]*\u201c(.+?)\u201d/))){const k=+m[1];h=[...m[2]].map(c=>'<span class=cl>'+bx(c)+'<small>\u2193 +'+k+'</small>'+bx(en(c,k),1)+'</span>').join('')+'<p class=mu>Satu kolom = satu huruf. Z kembali ke A.</p>'}
else if(q.s==='Urutan posisi'&&(m=E.match(/([A-Z][a-z]*(?:, [A-Z][a-z]*){4})/))){h='<p class=mu style=margin:0>DEPAN \u2192 BELAKANG</p>'+m[1].split(', ').map((n,i)=>'<span class=cl><small>'+(i+1)+'</small>'+bx(n,n===a)+'</span>').join('')}
else if(q.s==='Optimasi sumber daya'&&(m=E.match(/layak: (.+?)\. Maksimum/))){const r=m[1].split('; ').map(s=>s.match(/(.+) \(Rp(\d+) juta, (\d+) orang\)/)).filter(Boolean);h='<p class=mu style=margin:0>Anggaran Rp'+T.match(/Rp(\d+) juta/)[1]+' juta. Batang = penerima manfaat tiap kombinasi yang muat.</p>'+bars(r.map(x=>[x[1]+' (Rp'+x[2]+' jt)',+x[3]]),r.findIndex(x=>x[1]===a))}
else if(q.s==='Persentase berurutan'&&(m=E.match(/Harga baru = (\d+)\u00d7[\d.]+ = ([\d.]+); setelah diskon = [\d.]+\u00d7[\d.]+ = ([\d.]+)/))){h=bars([['Harga awal',+m[1]],['Setelah naik',+m[2]],['Setelah diskon',+m[3]]],2)}
else if(q.s==='Rata-rata gabungan'&&(m=E.match(/= (\d+); total awal = (\d+); selisih (\d+)/))){h=bars([['Total baru',+m[1]],['Total awal',+m[2]],['Selisih = jumlah 2 nilai baru',+m[3]]],2)}
else if(q.s==='Kombinatorika'&&(m=E.match(/= (\d+)[;.] [Tt]anpa wanita C\(\d+,\d+\) = (\d+)/))){h=bars([['Semua kemungkinan',+m[1]],['Tanpa wanita (dibuang)',+m[2]],['Minimal 1 wanita',+a]],2)}
else if(q.s==='Rasio'&&(m=T.match(/rasio (\d+) : (\d+) : (\d+)/))){h='<div style=display:flex;gap:4px>'+m.slice(1).map((v,i)=>'<span class='+(i%2?'bx':'bk')+' style=flex:'+v+';text-align:center>'+v+' bagian</span>').join('')+'</div><p class=mu>Selisih terbesar\u2013terkecil = selisih bagian \u00d7 nilai satu bagian.</p>'}
else if(q.s==='Kecepatan rata-rata'&&(m=T.match(/kecepatan (\d+) km\/jam.*? (\d+) km\/jam/))){h=bx('Berangkat '+m[1]+' km/jam')+' \u2192 '+bx('Lokasi (jarak d)')+' \u2192 '+bx('Pulang '+m[2]+' km/jam')+'<p class=mu>Waktu = d/'+m[1]+' + d/'+m[2]+'. Karena jarak sama, kecepatan tidak boleh dirata-ratakan langsung.</p>'}
return h}
const flow=e=>'<ol class=st>'+e.split(/;\s+|\.\s+(?=[A-Z\u201c])/).filter(Boolean).map(s=>'<li>'+s.replace(/\.$/,'')+'</li>').join('')+'</ol>';
function rich(q){const v=vis(q);return '<b>Pembahasan langkah demi langkah</b>'+(v?'<div class=vz role=group>'+v+'</div>':'')+flow(q.e)+'<div class=tp><b>Tips cepat:</b> '+(TP[q.s]||TC[q.c])+'</div><span class=mu>Keterampilan: '+q.s+'</span>'}
function render(){if(V==="exam"&&S.st!=="run")V="home";$("app").innerHTML=({home,exam,result,review,hist})[V]()}
addEventListener("keydown",e=>{if(V!=="exam"||S.st!=="run"||/INPUT|TEXTAREA/.test(e.target.tagName)&&e.target.type!=="radio")return;if(e.key==="ArrowRight")go(S.cur+1);if(e.key==="ArrowLeft")go(S.cur-1)});
if(S.st==="run"){if(rem()<=0){submit(true)}else{V="exam";tick();render()}}else render();
</script></body></html>
